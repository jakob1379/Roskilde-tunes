<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 960 294" width="960" height="294" role="img" aria-labelledby="t d">
<title id="t">Roskilde tunes: from festival line-up to Spotify playlist</title>
<desc id="d">Acts leave the Orange Scene line-up page, land on each act page's Spotify embed to give an artist id, that artist's top tracks are sorted by popularity and the top five are kept, and those five tracks fill the playlist.</desc>
<style>
svg{--bg:#F2F5FA;--ink:#1B2136;--muted:#5D6680;--line:#D3DAE6;--card:#FFFFFF;--bar:#B9C3D6;--orange:#FF6A13;--deep:#D9530A;--accent:#B8440A;--mouth:#262C44;--embed:#232A40;--lamp:#FFD54A;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){svg{--bg:#121726;--ink:#EEF1F8;--muted:#9AA4BD;--line:#2E3850;--card:#1B2235;--bar:#46526E;--orange:#FF7A2B;--deep:#E05E14;--accent:#FF9A55;--mouth:#0A0E1A;--embed:#0E1322}}
.bg{fill:var(--bg)}
.ground{stroke:var(--line);stroke-width:2}
.shell{fill:var(--orange)}
.rib{fill:none;stroke:var(--deep);stroke-width:2}
.mouth{fill:var(--mouth)}
.floor{fill:var(--deep)}
.lamp{fill:var(--lamp)}
.trail{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round;opacity:.6}
.chip rect{fill:var(--card);stroke:var(--orange);stroke-width:1.5}
.chip text{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.ln{fill:var(--line)}
.embed{fill:var(--embed)}
.disc{fill:var(--orange)}
.hole{fill:var(--embed)}
.groove{fill:none;stroke:var(--deep);stroke-width:1}
.eln{fill:#4A5372}
.id{font:600 11px var(--mono);fill:var(--accent);text-anchor:middle}
.arrow{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.bar{fill:var(--bar);transform-box:fill-box;transform-origin:50% 100%;transform:translate(var(--b),0)}
.bar.top{fill:var(--orange)}
.bar.rest{opacity:.35}
.cut{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4}
.cutl{font:600 11px var(--mono);fill:var(--accent);text-anchor:middle}
.ph{font:700 15px var(--round);fill:var(--ink)}
.sq{fill:var(--orange)}
.rl{fill:var(--bar)}
.cap{font:600 14px var(--round);fill:var(--ink);text-anchor:middle}
.sub{font:12px var(--mono);fill:var(--muted);text-anchor:middle}
.c1{transform:translate(242px,197px)}
.c2{transform:translate(326px,174px)}
.c3{opacity:0;transform:translate(408px,178px)}
@media (prefers-reduced-motion:no-preference){
.lamp{animation:lamp 12s ease-out infinite both}
.l2{animation-delay:.15s}.l3{animation-delay:.3s}.l4{animation-delay:.45s}.l5{animation-delay:.6s}
.chip{opacity:0;animation:travel 12s cubic-bezier(.45,0,.55,1) infinite both}
.c2{animation-delay:.45s}.c3{animation-delay:.9s}
.discg{transform-box:fill-box;transform-origin:50% 50%;animation:land 12s ease-out infinite both}
.cycle{animation:cycle 12s linear infinite both}
.id{animation:reveal 12s ease-out infinite both}
.bar{animation:bar 12s cubic-bezier(.6,0,.3,1) infinite both}
.bar.top{animation:bar 12s cubic-bezier(.6,0,.3,1) infinite both,pick 12s linear infinite both}
.bar.rest{animation:bar 12s cubic-bezier(.6,0,.3,1) infinite both,drop 12s linear infinite both}
.cutg{animation:reveal2 12s ease-out infinite both}
.row{animation:row 12s cubic-bezier(.2,.8,.3,1) infinite both}
.r2{animation-delay:.3s}.r3{animation-delay:.6s}.r4{animation-delay:.9s}.r5{animation-delay:1.2s}
}
@keyframes lamp{0%{opacity:.25}4%{opacity:1}92%{opacity:1}100%{opacity:.25}}
@keyframes travel{0%{opacity:0;transform:translate(130px,268px) scale(.6)}4%{opacity:1;transform:translate(150px,250px) scale(1)}8.5%{transform:translate(200px,218px)}13%{transform:translate(270px,187px)}17.5%{transform:translate(340px,173px)}22%{opacity:1;transform:translate(408px,178px) scale(1)}25%,100%{opacity:0;transform:translate(408px,178px) scale(.4)}}
@keyframes land{0%,21%{transform:scale(1)}25%{transform:scale(1.22)}30%,100%{transform:scale(1)}}
@keyframes reveal{0%,25%{opacity:0}30%,100%{opacity:1}}
@keyframes reveal2{0%,60%{opacity:0}65%,100%{opacity:1}}
@keyframes cycle{0%,91%{opacity:1}97%,100%{opacity:0}}
@keyframes bar{0%,31%{transform:translate(var(--a),0) scaleY(0)}42%,50%{transform:translate(var(--a),0) scaleY(1)}61%,100%{transform:translate(var(--b),0) scaleY(1)}}
@keyframes pick{0%,62%{fill:var(--bar)}67%,100%{fill:var(--orange)}}
@keyframes drop{0%,62%{opacity:1}67%,100%{opacity:.35}}
@keyframes row{0%,69%{opacity:0;transform:translateX(-24px)}74%,100%{opacity:1;transform:translateX(0)}}
</style>
<rect class="bg" y="76" width="960" height="294" rx="18"/>
<line class="ground" x1="24" y1="300" x2="936" y2="300"/>

<path class="trail" d="M130 268Q270 150 408 178"/>

<g class="cycle">
<path class="shell" d="M25 300A105 105 0 0 1 235 300Z"/>
<path class="rib" d="M40 300A90 90 0 0 1 220 300M55 300A75 75 0 0 1 205 300"/>
<path class="mouth" d="M62 300A68 68 0 0 1 198 300Z"/>
<rect class="floor" x="62" y="292" width="136" height="8" rx="2"/>
<circle class="lamp l1" cx="76" cy="279" r="4"/>
<circle class="lamp l2" cx="96" cy="252" r="4"/>
<circle class="lamp l3" cx="130" cy="242" r="4"/>
<circle class="lamp l4" cx="164" cy="252" r="4"/>
<circle class="lamp l5" cx="184" cy="279" r="4"/>
</g>

<g class="chip c1"><rect x="-28" y="-11" width="56" height="22" rx="11"/><text y="4">acts/…</text></g>
<g class="chip c2"><rect x="-28" y="-11" width="56" height="22" rx="11"/><text y="4">acts/…</text></g>
<g class="chip c3"><rect x="-28" y="-11" width="56" height="22" rx="11"/><text y="4">acts/…</text></g>

<rect class="card" x="368" y="100" width="128" height="180" rx="12"/>
<rect class="ln" x="384" y="116" width="72" height="8" rx="4"/>
<rect class="ln" x="384" y="132" width="48" height="6" rx="3"/>
<rect class="embed" x="380" y="152" width="104" height="52" rx="8"/>
<g class="discg"><circle class="disc" cx="408" cy="178" r="17"/><circle class="groove" cx="408" cy="178" r="11"/><circle class="hole" cx="408" cy="178" r="4"/></g>
<rect class="eln" x="432" y="170" width="40" height="6" rx="3"/>
<rect class="eln" x="432" y="182" width="28" height="6" rx="3"/>
<g class="cycle"><text class="id" x="432" y="232">artist/&lt;id&gt;</text></g>
<rect class="ln" x="384" y="252" width="64" height="6" rx="3"/>

<path class="arrow" d="M504 178h8m-4 -4 4 4 -4 4"/>

<g class="cycle" transform="translate(522 0)">
<rect class="bar rest" style="--a:0px;--b:154px" y="218" width="16" height="62" rx="3"/>
<rect class="bar top" style="--a:22px;--b:44px" y="162" width="16" height="118" rx="3"/>
<rect class="bar rest" style="--a:44px;--b:198px" y="240" width="16" height="40" rx="3"/>
<rect class="bar top" style="--a:66px;--b:88px" y="184" width="16" height="96" rx="3"/>
<rect class="bar top" style="--a:88px;--b:0px" y="140" width="16" height="140" rx="3"/>
<rect class="bar rest" style="--a:110px;--b:132px" y="206" width="16" height="74" rx="3"/>
<rect class="bar top" style="--a:132px;--b:66px" y="172" width="16" height="108" rx="3"/>
<rect class="bar rest" style="--a:154px;--b:176px" y="228" width="16" height="52" rx="3"/>
<rect class="bar top" style="--a:176px;--b:22px" y="152" width="16" height="128" rx="3"/>
<rect class="bar rest" style="--a:198px;--b:110px" y="194" width="16" height="86" rx="3"/>
<g class="cutg"><line class="cut" x1="107" y1="128" x2="107" y2="290"/><text class="cutl" x="107" y="118">-n 5</text></g>
</g>

<path class="arrow" d="M750 178h8m-4 -4 4 4 -4 4"/>

<rect class="card" x="768" y="100" width="168" height="180" rx="12"/>
<text class="ph" x="786" y="128">Playlist</text>
<g class="cycle">
<g class="row r1"><rect class="sq" x="786" y="143" width="12" height="12" rx="3"/><rect class="rl" x="808" y="146" width="96" height="6" rx="3"/></g>
<g class="row r2"><rect class="sq" x="786" y="167" width="12" height="12" rx="3"/><rect class="rl" x="808" y="170" width="78" height="6" rx="3"/></g>
<g class="row r3"><rect class="sq" x="786" y="191" width="12" height="12" rx="3"/><rect class="rl" x="808" y="194" width="104" height="6" rx="3"/></g>
<g class="row r4"><rect class="sq" x="786" y="215" width="12" height="12" rx="3"/><rect class="rl" x="808" y="218" width="64" height="6" rx="3"/></g>
<g class="row r5"><rect class="sq" x="786" y="239" width="12" height="12" rx="3"/><rect class="rl" x="808" y="242" width="88" height="6" rx="3"/></g>
</g>

<text class="cap" x="130" y="330">Festival line-up</text>
<text class="sub" x="130" y="350">/da/line-up/</text>
<text class="cap" x="432" y="330">Spotify embed</text>
<text class="sub" x="432" y="350">on each act page</text>
<text class="cap" x="631" y="330">Top tracks</text>
<text class="sub" x="631" y="350">by popularity, -c DK</text>
<text class="cap" x="852" y="330">Your playlist</text>
<text class="sub" x="852" y="350">replaced, then filled</text>
</svg>
